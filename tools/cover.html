<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Double Shift cover</title>
<style>html, body { margin: 0; background: #0b1029; } canvas { display: block; image-rendering: pixelated; }</style>
</head>
<body>
<!-- itch.io cover, 1260×1000 (630×500 ratio), drawn with the game's own sprites, tiles and font at 2× scale.
     Rendered to media/cover.png by scripts/media.mjs. -->
<canvas id="c" width="1260" height="1000"></canvas>
<script type="module">
import { drawText } from '../src/font.js';
import { drawSprite, drawEyes, SPRITES } from '../src/sprites.js';
import { PAL, DAY, NIGHT, TILE, PROPS, drawBackground, drawSolidTile, drawEchoEdges, drawShiftRing, drawSign, drawLogo, drawHatch } from '../src/art.js';

const cv = document.getElementById('c');
const g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
g.scale(2, 2); // draw at 630×500, every art pixel becomes 4×4
const W = 630;
const H = 500;
const SEAM = W / 2;
const clip = (x0, x1, fn) => { g.save(); g.beginPath(); g.rect(x0, 0, x1 - x0, H); g.clip(); fn(); g.restore(); };

clip(0, SEAM, () => drawBackground(g, DAY, W, H, 0));
clip(SEAM, W, () => drawBackground(g, NIGHT, W, H, 1.3));

// the floor, day bricks on the left, night panels on the right
for (const [layer, x0, x1] of [[DAY, 0, SEAM], [NIGHT, SEAM, W]]) {
  clip(x0, x1, () => {
    for (let tx = 0; tx < 21; tx++) for (let ty = 13; ty < 17; ty++) drawSolidTile(g, tx, ty, layer, { up: ty === 13, down: false, left: false, right: false });
  });
}

// a plank that only exists at night: solid on the night side, a dashed echo on the day side
for (const tx of [11, 12, 13]) {
  drawSolidTile(g, tx, 9, NIGHT, { up: true, down: true, left: tx === 11, right: tx === 13 });
  drawHatch(g, tx, 9, NIGHT);
}
drawEchoEdges(g, [[210, 270, 300, 270, 'top'], [210, 300, 300, 300, 'bot'], [210, 270, 210, 300, 'left']], PAL[NIGHT].echo);

// the freaks: eyes in the dark, one lurker on the night floor, a note on the day side
PROPS.eyes(g, 420, 170, { t: 0.5, seed: 1 });
PROPS.eyes(g, 560, 120, { t: 0.5, seed: 2 });
PROPS.eyes(g, 500, 300, { t: 0.5, seed: 3 });
drawSprite(g, 'lurker', 'a', 520, 390 - 22 * 1.5, { scale: 3 });
drawEyes(g, 'lurker', 520, 390 - 22 * 1.5, { state: 'squint', scale: 3 });
drawSign(g, 110, 300, 'MINE', 'note', 3);
PROPS.noticeBoard(g, 40, 330);

// the worker, mid-jump, mid-shift: day colours on the left of the seam, night on the right
drawShiftRing(g, SEAM, 268, 0.35, NIGHT);
drawShiftRing(g, SEAM, 268, 0.55, DAY);
const wx = SEAM - 4.5 * 5;
const wy = 236;
clip(0, SEAM, () => drawSprite(g, 'worker', 'jump', wx, wy, { scale: 5 }));
clip(SEAM, W, () => drawSprite(g, 'worker', 'jump', wx, wy, { scale: 5, palette: SPRITES.worker.nightPalette }));

// title lockup
drawLogo(g, SEAM, 34, 7);
drawText(g, 'The freaks come out at night.', SEAM, 104, { scale: 2, color: '#ffec5a', halo: '#1b1209', align: 'center' });

// bottom band
g.fillStyle = 'rgba(0,0,0,0.55)';
g.fillRect(0, 452, W, 48);
drawText(g, 'One building. Two shifts. One worker.', SEAM, 468, { scale: 2, color: '#ffffff', align: 'center' });
</script>
</body>
</html>
